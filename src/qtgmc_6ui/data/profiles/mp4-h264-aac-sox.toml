schema = 1
id = "mp4-h264-aac-sox"
name = "MP4 – H.264 + AAC, 25p, sox audio"
description = "Single-rate (25p / 29.97p) H.264 with AAC; audio goes through sox first (very-high-quality resample to 48 kHz, shaped dither). Needs the sox package."
container = "mp4"
extension = "mp4"

[video]
backend = "ffmpeg"
encoder = "libx264"
rate_control = "crf"
quality = 18.0
bitrate_kbps = 0
preset = "slow"
tune = ""
profile = "high"
level = ""
pix_fmt = "yuv420p"
extra_args = []
rate = "single"

[video.scale]
mode = "square"
width = 0
height = 0
algorithm = "lanczos"

[audio]
encoder = "aac"
bitrate_kbps = 192
sample_rate = 0
channels = 0
extra_args = []

[audio.sox]
enabled = true
effects = ["rate", "-v", "48000", "dither", "-s"]
