schema = 1
id = "mkv-hevc10-opus"
name = "MKV – HEVC 10-bit + Opus (efficient)"
description = "Small files: 10-bit HEVC (libx265, CRF 20, preset slow) with Opus 128 kb/s in Matroska, square pixels, frame rate kept."
container = "matroska"
extension = "mkv"

[video]
backend = "ffmpeg"
encoder = "libx265"
rate_control = "crf"
quality = 20.0
bitrate_kbps = 0
preset = "slow"
tune = ""
profile = ""
level = ""
pix_fmt = "yuv420p10le"
extra_args = []
rate = "keep"

[video.scale]
mode = "square"
width = 0
height = 0
algorithm = "lanczos"

[audio]
encoder = "libopus"
bitrate_kbps = 128
sample_rate = 0
channels = 0
extra_args = []

[audio.sox]
enabled = false
effects = []
