name: AUR release

# Tag vX.Y.Z (must equal __version__): pin the release checksum, regenerate .SRCINFO and push
# PKGBUILD and .SRCINFO to the AUR. No package build here (the release is live in about a minute);
# ci.yml checks every push and arch-canary.yml builds master every week. Setup and details:
# packaging/aur/PKGBUILD.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to prepare (dry run, nothing is published)
        required: true

permissions:
  contents: read

concurrency:
  group: aur-release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  prepare:
    name: Pin checksum and .SRCINFO (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Prepare Arch
        run: |
          # pacman's download sandbox needs kernel features that container runtimes block
          sed -i '/^\[options\]/a DisableSandboxFilesystem\nDisableSandboxSyscalls' /etc/pacman.conf
          sed -i 's/^CheckSpace/#CheckSpace/' /etc/pacman.conf
          pacman -Syu --needed --noconfirm --noprogressbar git sudo python
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag against the package version
        id: version
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/qtgmc_6ui/__init__.py)
          [ "${TAG#v}" = "$ver" ] || { echo "::error::tag $TAG does not match __version__ $ver"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Pin the release tarball checksum, refresh .SRCINFO
        run: |
          sudo -u builder -H env "WS=$GITHUB_WORKSPACE" bash -euo pipefail -c '
            cd "$WS"
            python3 -I packaging/sync-pkgbuild.py --project-sha256 auto
            python3 -I packaging/sync-pkgbuild.py --check
          '

      - uses: actions/upload-artifact@v7
        with:
          name: aur-files
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

    outputs:
      ver: ${{ steps.version.outputs.ver }}

  publish:
    name: Publish to the AUR
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aur-files
          path: files

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VER: ${{ needs.prepare.outputs.ver }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur)
          # pinned host key, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 (https://aur.archlinux.org)
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/qtgmc-6ui.git aur   # an empty clone on the first push is fine
          cd aur
          git checkout -B master                                   # the AUR only accepts master
          cp ../files/PKGBUILD ../files/.SRCINFO .
          git config user.name jogai
          git config user.email wouter@jogai.nl
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR already up to date"; exit 0; fi
          git commit -m "Update to $VER"
          git push origin master
