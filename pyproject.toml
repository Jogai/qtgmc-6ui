[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtgmc-6ui"
dynamic = ["version"]
description = "QTGMC deinterlacer for archival video with a Qt6 GUI (Arch Linux)"
readme = { text = "qtgmc-6UI: QTGMC deinterlacing (VapourSynth) with a PySide6 GUI and a scriptable CLI.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Jogai" }]
# Runtime dependencies.  Packages that Arch provides (vapoursynth, pyside6,
# numpy, psutil, rich, typing_extensions) are declared by the PKGBUILD and
# excluded from uv resolution below, so uv.lock only holds the bundled
# pure-python closure: vsjetpack + jetpytools.
dependencies = [
    "vsjetpack==2.2.6",
    "jetpytools==3.1.2",
]

[project.scripts]
qtgmc-6ui = "qtgmc_6ui.cli:main"

[project.urls]
Homepage = "https://github.com/jogai/qtgmc-6ui"

[tool.hatch.version]
path = "src/qtgmc_6ui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qtgmc_6ui"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "packaging/", "pyproject.toml", "uv.lock"]

[tool.uv]
# Provided by official Arch packages (see packaging/aur/PKGBUILD depends=);
# never resolved from PyPI.  Names are normalised, case-insensitive.
exclude-dependencies = [
    "vapoursynth",
    "vapoursynth-akarin",
    "vapoursynth-vszip",
    "numpy",
    "psutil",
    "rich",
    "typing-extensions",
    "pyside6",
    "shiboken6",
]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_sandbox: needs the Arch sandbox tools (ffmpeg, vapoursynth, bestsource)",
    "needs_qtgmc: needs the full bundled QTGMC stack (vsjetpack + native plugins)",
    "needs_tool(name): needs an optional external tool (x264, x265, kvazaar, sox)",
    "slow: takes more than ~10 s",
    "gui: needs a Qt platform (offscreen or xvfb)",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:vapoursynth"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
